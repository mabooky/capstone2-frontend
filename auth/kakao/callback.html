<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>로그인 처리 중</title>
<link rel="stylesheet" href="/customer.css">
<style>
.auth{max-width:380px;margin:10vh auto 0;text-align:center}
.auth h1{margin-bottom:8px}
.auth p{color:var(--mute);margin:0;font-size:.9rem}
.spinner{width:40px;height:40px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:spin .8s linear infinite;margin:20px auto}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="auth">
  <div class="spinner" id="spin"></div>
  <h1 id="title">로그인 처리 중</h1>
  <p id="msg">카카오 로그인을 확인하고 있습니다.</p>
  <button class="btn" id="back" style="margin-top:20px" hidden>돌아가기</button>
</div>
<script src="/config.js"></script>
<script>
(function(){
  var C=window.APP_CONFIG||{};
  var qs=new URLSearchParams(location.search);
  var code=qs.get("code");
  var state=qs.get("state");
  var msgEl=document.getElementById("msg");

  function showMsg(text){
    msgEl.textContent=text;
  }

  /* 실패하면 자동으로 이동하지 않고, 사용자가 확인한 뒤 돌아가기를 누르게 합니다. */
  function fail(text){
    document.getElementById("spin").hidden=true;
    document.getElementById("title").textContent="로그인에 실패했어요";
    showMsg(text);
    document.getElementById("back").hidden=false;
  }
  document.getElementById("back").onclick=function(){finish()};

  /* state는 "<난수>.<매장ID>" 형식입니다. 매장 ID는 되돌아갈 주소에만 쓰므로 검증 전에 읽어도 됩니다. */
  var storeId=(state||"").slice((state||"").lastIndexOf(".")+1);
  if(!/^[0-9a-z]{8}$/.test(storeId))storeId="";

  /* 원인 추적용 로그입니다. 인가 코드와 토큰의 값은 출력하지 않습니다. */
  function log(){
    console.log.apply(console,["[kakao-callback]"].concat([].slice.call(arguments)));
  }

  function finish(){
    history.replaceState(null,"",location.pathname);
    location.href="/customer.html"+(storeId?"?store="+storeId:"");
  }

  log("콜백 진입",{
    path:location.pathname,
    error:qs.get("error"),
    errorDescription:qs.get("error_description"),
    codeLength:code?code.length:0,
    stateNonceLength:(state||"").lastIndexOf(".")>0?state.lastIndexOf("."):0,
    storeId:storeId||null,
    apiOrigin:C.API_ORIGIN||null,
    configuredRedirectUri:C.KAKAO_REDIRECT_URI||null
  });

  if(!code){
    fail("로그인 정보가 없어요. 다시 시도해 주세요.");
    return;
  }

  var savedState=null;
  try{savedState=sessionStorage.getItem("sj.kstate");sessionStorage.removeItem("sj.kstate")}catch(e){}

  log("state 확인",{saved:!!savedState,matches:!!savedState&&state===savedState});

  if(!savedState||state!==savedState){
    fail("로그인 확인값이 달라 중단했어요. 다시 시도해 주세요.");
    return;
  }

  var apiOrigin=C.API_ORIGIN||"";
  var acc=apiOrigin;

  fetch(acc+"/auth/kakao/login",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({code:code})
  })
  .then(function(r){
    log("로그인 응답",{status:r.status});
    if(!r.ok){
      return r.json().then(function(j){
        log("로그인 오류 응답",j);
        var err=(j&&j.error)||{};
        throw{status:r.status,code:err.code||"HTTP_"+r.status,message:err.message||"요청에 실패했어요."};
      });
    }
    return r.json();
  })
  .then(function(j){
    log("로그인 성공 응답",{hasToken:!!(j&&j.token),expiresAt:j&&j.expiresAt,nickname:j&&j.user&&j.user.nickname});
    if(!j||!j.token){
      fail("로그인 처리에 실패했어요. 다시 시도해 주세요.");
      return;
    }
    try{
      sessionStorage.setItem("sj.token",j.token);
      sessionStorage.setItem("sj.nick",(j.user&&j.user.nickname)||"");
    }catch(e){}
    finish();
  })
  .catch(function(e){
    log("로그인 요청 실패",e);
    if(e.code==="INVALID_KAKAO_CODE"){
      fail("카카오 로그인에 실패했어요. 다시 시도해 주세요.");
    }else if(e.code==="KAKAO_UNAVAILABLE"){
      fail("카카오 서버와 통신하지 못했어요. 처음부터 다시 로그인해 주세요.");
    }else{
      fail("로그인 처리 중 오류가 발생했어요. 다시 시도해 주세요.");
    }
  });
})();
</script>
</body>
</html>
